<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shztools</title>
  </head>
  <body>
    <script>
      // Applied before first paint so the stored theme does not flash.
      // Values are not validated here on purpose: keeping a copy of the theme
      // list in sync with theme.ts is what would eventually cause the flash.
      // Anything unrecognised falls through to the :root defaults (dark), and
      // theme.ts corrects it on mount. Key must match KEY in src/ui/theme.ts.
      try {
        var t = localStorage.getItem("shztools.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
